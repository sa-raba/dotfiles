services:
  app:
    image: ${CODEX_IMAGE:?CODEX_IMAGE is required}
    pull_policy: never
    environment:
      CODEX_CONTAINER: "1"
      CODEX_AGENT_BASE: /workspace/.codex-agents
    networks:
      - work-shared
    working_dir: /workspace
    volumes:
      - ${PWD}:/workspace
      - ${HOME}/.aws:/home/work/.aws
      - ${HOME}/.ssh:/home/work/.ssh
      - ${HOME}/.codex:/home/work/.codex
      - ${HOME}/.gemini:/home/work/.gemini
      - ${HOME}/project/shared-docs:/workspace/.local
    stdin_open: true
    tty: true
    command: /bin/bash

networks:
  work-shared:
    external: true
